name: Renovate

on:
  schedule:
    # Once a day.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure guarded licence refresh with pinned mobile tools
        run: python3 scripts/renovate_licences.py --config > "$RUNNER_TEMP/renovate-licences.json"
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          token: "${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}"
          configurationFile: ${{ runner.temp }}/renovate-licences.json
        env:
          # The repo-level `renovate.json` at the repo root is auto-discovered;
          # this just tells self-hosted Renovate which repo to scan.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
