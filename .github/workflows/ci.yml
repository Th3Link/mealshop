name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  quality:
    name: fmt, clippy, nextest and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: python3 scripts/generate_docs.py --check
      - run: python3 scripts/import_catalogue.py --check
      - run: python3 scripts/verify_catalogue.py
      - run: python3 scripts/import_nutrition_estimates.py --check
      - run: python3 scripts/verify_nutrition_estimates.py
      - run: python3 scripts/verify_conversions.py
      - run: python3 scripts/verify_allergens.py
      - run: node --check src/web/demo.mjs
      - run: node --test tests/i18n.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo llvm-cov nextest --workspace --locked --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error
  msrv:
    name: declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - run: cargo msrv verify -- cargo check --all-targets --locked
      - run: cargo msrv verify -- cargo check --all-targets --all-features --locked
  build:
    name: build / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Measure server binary
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 scripts/binary_metrics.py "$PROFILE"
      - uses: actions/upload-artifact@v7
        with:
          name: mealshop-server-${{ matrix.profile }}-linux-x86_64
          path: target/${{ matrix.profile }}/mealshop-server
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ matrix.profile }}
          path: metrics/*.json
          if-no-files-found: error
  metrics:
    name: binary metrics report
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics
      - name: Report measured sizes
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("### Server binary size\n\n| Profile | Bytes | Commit |\n|---|---:|---|")
          for path in sorted(Path("metrics").glob("*.json")):
              data = json.loads(path.read_text())
              print(f"| {data['profile']} | {data['bytes']} | {data['sha']} |")
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: server-metrics
          path: metrics/
          if-no-files-found: error
  sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sbom
      - run: cargo sbom --output-format=spdx_json_2_3 --cargo-package mealshop-server > mealshop-server.spdx.json
      - name: Verify nonempty package graph
        run: |
          python3 - <<'PYCODE'
          import json
          data = json.load(open("mealshop-server.spdx.json"))
          assert len(data["packages"]) > 1, "SBOM must contain the dependency graph"
          assert any(p["name"] == "mealshop-server" for p in data["packages"])
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: mealshop-server-sbom
          path: mealshop-server.spdx.json
          if-no-files-found: error
  nextcloud-client:
    name: native Vue client / types, contracts, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/nextcloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: clients/nextcloud/package.json
          cache: npm
          cache-dependency-path: clients/nextcloud/package-lock.json
      - name: Validate the declared npm toolchain
        run: node --test ../../tests/npm-toolchain.test.mjs
      - name: Install the declared npm toolchain
        run: |
          npm_spec="$(node ../../scripts/npm_toolchain.mjs)"
          npm install --global "$npm_spec" --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: node ../../scripts/generate_mcp_schema.mjs --check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v7
        with:
          name: mealshop-nextcloud-assets
          path: clients/nextcloud/dist/
          if-no-files-found: error
  exapp-image:
    name: ExApp image / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mealshop.local/mealshop:ci .
      - name: Verify rootless TCP and Unix transports
        run: python3 scripts/test_exapp_container.py --image mealshop.local/mealshop:ci
      - uses: azure/setup-helm@v5.1.0
        if: matrix.arch == 'amd64'
        with:
          version: v4.3.2
      - uses: helm/kind-action@v1.15.2
        if: matrix.arch == 'amd64'
        with:
          install_only: true
      - name: Verify chart startup and persistence in an isolated cluster
        if: matrix.arch == 'amd64'
        run: python3 scripts/test_helm_runtime.py --image mealshop.local/mealshop:ci
  helm-chart:
    name: release metadata and Helm / ${{ matrix.helm }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.22.1, v4.3.2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ matrix.helm }}
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/release.py
      - name: Validate workflow contracts
        if: matrix.helm == 'v4.3.2'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
      - name: Test guarded Renovate licence publication
        if: matrix.helm == 'v4.3.2'
        run: python3 -m unittest discover -s tests -p 'test_licence_inventories.py'
      - name: Validate actual self-hosted Renovate configuration
        if: matrix.helm == 'v4.3.2'
        run: |
          python3 scripts/renovate_licences.py --config > "$RUNNER_TEMP/renovate-licences.json"
          docker run --rm --entrypoint renovate-config-validator \
            -v "$RUNNER_TEMP/renovate-licences.json:/renovate-licences.json:ro" \
            ghcr.io/renovatebot/renovate:44 --strict /renovate-licences.json
          docker run --rm --network none --entrypoint renovate-config-validator \
            -v "$PWD/renovate.json:/renovate.json:ro" \
            ghcr.io/renovatebot/renovate:44 --strict /renovate.json
          docker run --rm --network none --entrypoint node -w /usr/local/renovate \
            -v "$PWD/renovate.json:/policy/renovate.json:ro" \
            -v "$PWD/tests/renovate-policy.cjs:/policy/tests/renovate-policy.cjs:ro" \
            -v "$PWD/clients/nextcloud/package.json:/policy/clients/nextcloud/package.json:ro" \
            -v "$PWD/clients/nextcloud/package-lock.json:/policy/clients/nextcloud/package-lock.json:ro" \
            -v "$PWD/.github/workflows/ci.yml:/policy/.github/workflows/ci.yml:ro" \
            -v "$PWD/Dockerfile:/policy/Dockerfile:ro" \
            ghcr.io/renovatebot/renovate:44 /policy/tests/renovate-policy.cjs
      - run: python3 -m unittest discover -s tests -p 'test_release.py'
  mcp-client:
    name: MCP / official client and stdio interoperability
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: clients/nextcloud/package.json
          cache: npm
          cache-dependency-path: clients/nextcloud/package-lock.json
      - name: Install the declared npm toolchain
        run: |
          npm_spec="$(node scripts/npm_toolchain.mjs)"
          npm install --global "$npm_spec" --ignore-scripts --no-audit --no-fund
      - run: npm --prefix clients/nextcloud ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: mealshop-server-debug-linux-x86_64
          path: bin
      - run: chmod +x bin/mealshop-server
      - run: python3 -m unittest discover -s tests -p 'test_mcp_stdio.py'
      - run: node scripts/test_mcp_client.mjs bin/mealshop-server
