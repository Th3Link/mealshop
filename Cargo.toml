[package]
name = "mealshop-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Mealshop recipe, shopping and family meal planning server"
repository = "https://github.com/Th3Link/mealshop"
publish = false

[features]
device = ["dep:age", "dep:tar"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

base64 = "0.23"
subtle = "2.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tower = { version = "0.5", features = ["util"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

html5ever = "=0.40.1"
robotstxt = "=0.3.0"
age = { version = "0.12.0", default-features = false, optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
