{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mealshop.claim" . }}
  labels:
    {{- merge (include "mealshop.labels" . | fromYaml) .Values.persistence.labels | toYaml | nindent 4 }}
  annotations:
    {{- merge (dict "helm.sh/resource-policy" "keep") .Values.persistence.annotations | toYaml | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
